            /* NAV */
            nav {

            }

            nav .site-name {

                letter-spacing: 0.01em;
            }

            .lang-toggle {
                display: flex;

            }

            .lang-toggle button {
                background: none;
                border: none;
                cursor: pointer;
                color: #555;
                font-size: 0.85rem;
                font-family: inherit;
                padding: 0;
            }

            .lang-toggle .sep {
                color: #333;
            }

            .lang-toggle button.active {
                color: #e8e8e0;
                font-weight: 500;
            }

            /* HERO */
            .hero {
                width: 100%;
                height: 60vh;
                position: relative;
                overflow: hidden;
            }

            .hero img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .hero::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to bottom,
                    rgba(10, 10, 15, 0.2) 0%,
                    rgba(10, 10, 15, 1) 100%
                );
            }

            /* INTRO */
            .intro {
                max-width: 640px;
                margin: 3rem auto;
                padding: 2rem 2rem 2rem 1.5rem;
                border-left: 2px solid #333;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 1.1rem;
                color: #e8e8e0;
            }

            .intro h1 {
                font-size: 1.15rem;
                font-weight: 400;
                font-style: italic;
                margin-bottom: 1rem;
                line-height: 1.4;

            .intro p {

                font-size: 0.95rem;

            .services {
                max-width: 960px;

                padding: 0 2rem;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));

            .card {

                border: 0.5px solid #2a2a3a;
                border-radius: 6px;
                padding: 1.5rem;

                color: #e8e8e0;
                margin-bottom: 0.4rem;
                letter-spacing: 0.02em;

                color: #555;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                margin-bottom: 0.75rem;
            }

            .card p {
                font-size: 0.875rem;
                color: #888;
                line-height: 1.7;
            }

            .card ul {
                margin-top: 0.75rem;
                padding-left: 1.25rem;
                font-size: 0.875rem;
                color: #666;
                line-height: 1.7;
            }

            .card ul li {
                margin-bottom: 0.2rem;
            }

            /* CONTACT */

                text-align: center;
                margin: 3rem auto;
            }

            .contact a {
                font-size: 0.95rem;
                color: #e8e8e0;
                text-decoration: none;
                border-bottom: 1px solid #444;
                padding-bottom: 2px;
                transition: border-color 0.15s;

            .contact a:hover {
                border-color: #888;
            }

            /* FOOTER */

                text-align: center;
                color: #444;
                font-size: 13px;
                margin: 2rem auto 3rem;
            }

            footer a {
                color: #444;
            }

            footer a:hover {
                color: #888;
            }

            @media (max-width: 680px) {
                .services {
                    grid-template-columns: 1fr;
                    padding: 0 1.25rem;
                }
                nav {
                    padding: 1rem 1.25rem;
                }
                .intro {
                    margin: 2rem 1.25rem;

                    pol_point_3: "Utforming av policy-notater og presentasjoner for myndigheter.",
                    radgjof_card3_title: "Veiledning og teknisk rådgivning",
                    radgjof_card3_sub: "For kunstnere og designere",
                    radgjof_card3_body: "Teknologi i seg selv er bare et verktøy – men styrt av en klar visjon kan den transformere bevissthet og opplevelse. Jeg veileder kunstnere i å overvinne teknisk frykt og bruke verktøy som KI på egne premisser. Enten det handler om å bruke kunstig intelligens for å effektivisere administrasjon og frigjøre kreativ tid, eller å løse komplekse utfordringer, hjelper jeg deg med å holde kjernen i verket i fokus.",

                    footer: "Honorar etter SÍM faglige retningslinjer",

            function detectLang() {
                const l = navigator.language || "";
                if (l.startsWith("is")) return "is";
                if (
                    l.startsWith("no") ||
                    l.startsWith("nb") ||
                    l.startsWith("nn") ||
                    l.startsWith("da")
                )
                    return "no";
                return "en";
            }

            function setLang(lang) {
                const s = strings[lang];
                document.querySelectorAll("[data-i18n]").forEach((el) => {
                    const key = el.getAttribute("data-i18n");
                    if (s[key] !== undefined) {
                        el.textContent = s[key];
                    }
                });
                document
                    .querySelectorAll(".lang-toggle button")
                    .forEach((btn) => {
                        btn.classList.toggle(
                            "active",
                            btn.getAttribute("data-lang") === lang,
                        );
                    });
                document.documentElement.lang = lang === "no" ? "nb" : lang;
            }

            setLang(detectLang());
